<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>node 별 예측을 강체 움직임으로 맞추는 예. 옮기기 전 node A(0, 0), B(2, 0), C(0, 1) 에 network 가 오른쪽으로 0.6, 0.4, 0.5 cm 움직이라고 예측하면 A–B 거리가 2 에서 1.8 로 줄어든다. SVD 로 맞춘 강체 움직임은 회전 0°, 오른쪽 0.5 cm 라서 세 node 가 (0.5, 0), (2.5, 0), (0.5, 1) 로 가고 거리 2 가 유지된다</title>
